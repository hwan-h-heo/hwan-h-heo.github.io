        <!-- <main class="main"> -->
        <simple-model-viewer 
            src="/assets/profile_3d.glb"
            camera-orbit="0 0 20"
            background-color="#cbd5e1"
            selection-mode="all"
            performance-mode="default"
            ui
            view-mode="diffuse"
            angle-per-second="45"
            ambient-light="0x808080 3">
        </simple-model-viewer>
        <script type="module">
            import { SimpleModelViewer } from '../../js/simple-model-viewer.js';
    
            // Resizing
            window.addEventListener('resize', () => {
                const viewers = document.querySelectorAll('simple-model-viewer');
                viewers.forEach(viewer => viewer.resizeRenderer());
            });
        </script>
