<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="Search Hwan Heo's technical articles and research notes" />
        <meta name="author" content="Hwan Heo" />
        <title>Search | Hwan Heo</title>
        <link rel="icon" type="image/x-icon" href="../../assets/favicon.ico" />
        <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Manrope:wght@500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
        <link href="../css/blog.css?v=a1fa956e9d" rel="stylesheet" />
        <link href="../css/typography.css?v=5feaa1dfce" rel="stylesheet" />
        <link href="/assets/css/site-icons.css?v=32957b8b04" rel="stylesheet" />
        <script src="/assets/js/site-icons.js?v=76c23064c5"></script>
        <script>
            (function() {
                try {
                    const storedTheme = localStorage.getItem('blog-theme');
                    const theme = storedTheme === 'dark' || storedTheme === 'light' ? storedTheme : 'light';
                    document.documentElement.dataset.theme = theme;
                } catch (error) {}
            })();
        </script>
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-RF7ETSKPK9"></script>
        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', 'G-RF7ETSKPK9');
        </script>
        <meta name="site-deploy-version" content="70177764564cc6d9">
    <script defer src="/assets/js/deploy-refresh.js?v=adb609281d"></script>
</head>
    <body class="blog-home-page blog-archive-page blog-search-page">
        <main class="main blog-home-main">
            <nav class="blog-home-topbar" id="blogHomeTopbar" aria-label="Blog utilities">
                <a class="blog-home-back" href="../" aria-label="Back to blog home">
                    <svg class="site-icon" aria-hidden="true" focusable="false"><use href="/assets/icons/site-icons.svg#icon-arrow-left"></use></svg>
                    <span>Blog</span>
                </a>
                <div class="blog-home-toolbar-actions">
                    <form id="search-form" class="blog-home-search" role="search" data-collapsible-search>
                        <label class="visually-hidden" for="search-input">Search posts</label>
                        <input type="text" id="search-input" placeholder="Search...">
                        <button type="submit" id="search-button" aria-label="Search">
                            <svg class="site-icon" aria-hidden="true" focusable="false"><use href="/assets/icons/site-icons.svg#icon-search"></use></svg>
                        </button>
                    </form>
                    <button class="blog-theme-toggle" type="button" data-theme-toggle aria-label="Toggle color theme" aria-pressed="false">
                        <svg class="site-icon" data-icon="moon-stars" aria-hidden="true" focusable="false"><use href="/assets/icons/site-icons.svg#icon-moon-stars"></use></svg>
                    </button>
                    <button id="lang-toggle-main" class="blog-home-language" type="button" aria-label="한국어로 전환" title="한국어로 전환">가</button>
                </div>
            </nav>

            <header class="masthead blog-home-hero blog-editorial-utility-hero">
                <div class="blog-shell blog-hero-shell">
                    <div class="blog-editorial-utility-copy">
                        <div class="blog-editorial-imprint">
                            <div class="blog-editorial-brandline" lang="en">
                                <span class="blog-editorial-index">00</span>
                                <span class="blog-editorial-separator" aria-hidden="true">/</span>
                                <span class="blog-home-kicker" data-search-copy="kicker">Search Index</span>
                            </div>
                            <span class="blog-editorial-edition" lang="en">Hwan's Blog</span>
                        </div>
                        <h1 data-search-copy="title">Search the archive</h1>
                        <p data-search-copy="intro">Find research notes by title, topic, tag, or anything mentioned in the article.</p>
                    </div>
                </div>
            </header>

            <div class="blog-shell blog-home-container">
                <section class="blog-home-archive blog-editorial-archive blog-search-results" aria-labelledby="search-results-heading">
                    <div class="blog-home-archive-head blog-editorial-section-head">
                        <h2 id="search-results-heading">
                            <span class="blog-home-archive-index" aria-hidden="true">01</span>
                            <span data-search-copy="results">Results</span>
                        </h2>
                        <span class="blog-home-archive-rule" aria-hidden="true"></span>
                        <span id="search-result-count" class="blog-search-count" aria-live="polite"></span>
                    </div>
                    <div id="search-results-container" class="blog-home-tab-content" aria-live="polite">
                        <p class="blog-search-state">Searching the archive...</p>
                    </div>
                </section>
            </div>
        </main>

        <footer class="blog-home-footer">
            <div class="blog-shell">
                <div class="blog-home-footer-row">
                    <div class="blog-home-footer-copy">
                        <div class="blog-footer-note">Copyright &copy; Hwan Heo</div>
                    </div>
                </div>
            </div>
        </footer>

        <script src="../js/site-data-client.js?v=5320e49fbf"></script>
        <script src="../js/blog-cover-media.js?v=f16969bf34"></script>
        <script src="../js/blog-shell.js?v=456de34605"></script>
        <script src="../js/theme-toggle.js?v=32f6914d64"></script>
        <script src="../js/search-page.js?v=2bc06dfa60"></script>
        <script>
            initBlogShell({ formSelector: '#search-form', inputSelector: '#search-input' });
        </script>
    </body>
</html>
