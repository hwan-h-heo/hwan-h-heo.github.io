                display: inline-block;

            .series-group .series-title {

            }

            .series-group .series-post-list {

                        <div class="input-group">
                            <input type="text" id="search-input" class="form-control form-control-lg" placeholder="Enter search term...">
                            <button class="btn btn-dark" type="submit" id="search-button" aria-label="Search">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-search" viewBox="0 0 16 16">
                                    <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/>

                    <hr class="my-4" />

                    <!-- 검색 결과가 여기에 동적으로 삽입됩니다 -->
                    <div id="search-results-container">
                        <!-- 로딩 스피너 (선택 사항) -->

                    </div>

                              <path

                            </svg>
