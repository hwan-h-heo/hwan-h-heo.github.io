<!doctype html>
<html lang="en" data-hero-voxel-standalone="true">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hierarchical Surface Decoding</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, sans-serif;
      background: #101011;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #101011;
    }

    html.hero-voxel-camera-tuner body {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      align-items: center;
      gap: 24px;
      padding: 24px;
    }

    html.hero-voxel-camera-tuner .voxel-demo {
      justify-self: end;
      width: min(920px, 100%, calc((100vh - 48px) * 16 / 9));
      height: auto;
      aspect-ratio: 16 / 9;
      border: 1px solid rgba(201, 216, 222, 0.14);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.42);
    }

    .voxel-demo {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 74% 48%, rgba(117, 145, 156, 0.09), transparent 34%),
        linear-gradient(118deg, #101011 0%, #101011 45%, #17191a 100%);
    }

    .voxel-demo__stage {
      position: absolute;
      inset: 0;
      width: 100%;
      min-width: 0;
      overflow: hidden;
    }

    .hero-content {
      display: none;
    }

    .hero-voxel-canvas,
    .hero-voxel-particle-canvas {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .hero-voxel-canvas {
      z-index: 1;
      opacity: 0;
      filter: saturate(0.9);
      transition: opacity 450ms ease;
    }

    .hero-voxel-ready .hero-voxel-canvas {
      opacity: 1;
    }

    .hero-voxel-particle-canvas {
      z-index: 0;
    }

    .voxel-demo__meta {
      position: absolute;
      top: clamp(1rem, 5vw, 2.1rem);
      left: clamp(1rem, 5vw, 2.2rem);
      z-index: 2;
      margin: 0;
      color: rgba(209, 218, 222, 0.62);
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: clamp(0.58rem, 1.35vw, 0.72rem);
      line-height: 1.65;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .voxel-demo__meta strong {
      display: block;
      color: rgba(225, 231, 234, 0.82);
      font: inherit;
      letter-spacing: 0.03em;
    }

    .voxel-demo__playback {
      position: absolute;
      left: clamp(1rem, 5vw, 2.2rem);
      bottom: clamp(1rem, 4vw, 1.8rem);
      z-index: 2;
      min-width: 4.25rem;
      padding: 0.42rem 0.62rem;
      border: 1px solid rgba(201, 216, 222, 0.2);
      border-radius: 999px;
      color: rgba(218, 227, 230, 0.72);
      background: rgba(16, 16, 17, 0.56);
      font: 0.62rem/1 ui-monospace, SFMono-Regular, Consolas, monospace;
      letter-spacing: 0.05em;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }

    .voxel-demo__playback:hover,
    .voxel-demo__playback:focus-visible {
      color: rgba(235, 240, 242, 0.94);
      border-color: rgba(201, 216, 222, 0.42);
      outline: none;
    }

    .voxel-demo__playback:disabled {
      cursor: default;
      opacity: 0.55;
    }

    .hero-wave-fallback .voxel-demo__stage {
      background: url("./flashvdm-volume-decoding-poster.webp") center / contain no-repeat;
      opacity: 0.48;
    }

    @media (max-width: 560px) {
      .voxel-demo__meta span {
        display: none;
      }
    }

    @media (max-width: 980px) {
      html.hero-voxel-camera-tuner body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        overflow: auto;
      }

      html.hero-voxel-camera-tuner .voxel-demo {
        flex: 0 0 auto;
        width: min(100%, 720px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .hero-voxel-canvas {
        transition: none;
      }
    }
  </style>
    <meta name="site-deploy-version" content="dfd47d262a514c61">
    <script defer src="/assets/js/deploy-refresh.js?v=ee9c6c8f26"></script>
</head>
<body>
  <main class="voxel-demo">
    <p class="voxel-demo__meta" aria-hidden="true">
      <span>Live / Three.js</span>
      <strong>8&sup3; &rarr; 16&sup3; &rarr; 32&sup3; &rarr; 64&sup3; &rarr; 128&sup3;</strong>
    </p>
    <section
      id="home"
      class="voxel-demo__stage"
      role="img"
      aria-label="Looping coarse-to-fine surface voxel decoding animation"
    >
      <div class="hero-content"></div>
    </section>
    <button
      class="voxel-demo__playback"
      type="button"
      data-voxel-playback
      aria-pressed="false"
    >Pause</button>
  </main>
  <script>
    // Intersection inside an iframe does not reflect whether the iframe itself
    // has left the article viewport. Observe the same-origin frame from its
    // parent so the standalone renderer can pause while the reader scrolls.
    if (window.parent !== window && window.frameElement) {
      try {
        const parentObserver = new window.parent.IntersectionObserver((entries) => {
          const visible = entries[0]?.isIntersecting ?? true;
          document.documentElement.dataset.heroVoxelParentVisible = String(visible);
          window.dispatchEvent(new CustomEvent('hero-voxel-parent-visibility', {
            detail: { visible },
          }));
        }, { threshold: 0.02 });
        parentObserver.observe(window.frameElement);
        window.addEventListener('pagehide', () => parentObserver.disconnect(), { once: true });
      } catch (error) {
        // Cross-origin embedding is not used by the Note, but the visualization
        // still retains its internal visibility and document-hidden fallbacks.
      }
    }
  </script>
  <script type="module" src="/js/hero-voxel.js?v=f60e690f94"></script>
</body>
</html>
