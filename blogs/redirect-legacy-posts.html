<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }
        .message {
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="message">
        <p>Redirecting to the new blog location...</p>
    </div>

    <script src="/blogs/js/site-data-client.js"></script>
    <script>
        (async function() {
            const urlParams = new URLSearchParams(window.location.search);
            const postId = urlParams.get('id');
            const siteData = await window.siteDataClient.loadSiteData();
            const post = siteData.postById[postId];

            if (post) {
                window.location.href = `/blogs/posts/${post.slug}/`;
            } else {
                window.location.href = '/blogs/';
            }
        })();
    </script>
</body>
</html>
