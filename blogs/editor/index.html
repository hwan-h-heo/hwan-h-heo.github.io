    <script>
        const API_BASE = 'http://localhost:3030/api';
        const editor = document.getElementById('editor-textarea');
        const preview = document.getElementById('preview-content');
        const modalOverlay = document.getElementById('modal-overlay');
        const modalTitle = document.getElementById('modal-title');
        const modalBody = document.getElementById('modal-body');

        // Check if we're in edit mode
        if (window.location.port === '3030') {
            document.body.classList.add('edit-mode');
        }

        // Insert markdown helper
        function insertMarkdown(before, after) {
            const start = editor.selectionStart;
            const end = editor.selectionEnd;
            const selectedText = editor.value.substring(start, end);
            const replacement = before + selectedText + after;

            editor.value = editor.value.substring(0, start) + replacement + editor.value.substring(end);
            editor.focus();
            editor.selectionStart = start + before.length;
            editor.selectionEnd = start + before.length + selectedText.length;

            updatePreview();
        }

        // Update preview
        function updatePreview() {
            const markdown = editor.value;
            let html = marked.parse(markdown);

            // Convert relative draft-assets paths to server paths for preview
            html = html.replace(/\.\/draft-assets\//g, '/editor/draft-assets/');

            preview.innerHTML = html;

            // Render math
            if (typeof renderMathInElement !== 'undefined') {
                renderMathInElement(preview, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false},
                        {left: '\\(', right: '\\)', display: false},
                        {left: '\\[', right: '\\]', display: true}
                    ],
                    throwOnError: false
                });
            }

            // Highlight code
            Prism.highlightAllUnder(preview);
        }

        // Debounce function
        function debounce(func, delay) {
            let timeout;
            return function(...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(this, args), delay);
            };
        }

        // Update word and character count
        function updateStats() {
            const text = editor.value;
            const words = text.trim().split(/\s+/).filter(w => w.length > 0).length;
            const chars = text.length;
            document.getElementById('word-count').textContent = `${words} words`;
            document.getElementById('char-count').textContent = `${chars} chars`;
        }

        // Clipboard image paste handler
        editor.addEventListener('paste', async (e) => {
            const items = e.clipboardData.items;

            for (let item of items) {
                if (item.type.indexOf('image') !== -1) {
                    e.preventDefault();

                    const file = item.getAsFile();
                    const reader = new FileReader();

                    reader.onload = async (event) => {
                        try {
                            // Show loading indicator
                            const loadingText = '\n![Uploading image...]()\n';
                            insertMarkdown(loadingText, '');

                            // Convert to WebP
                            const webpBlob = await convertToWebP(event.target.result);

                            // Upload to server
                            const filename = `image-${Date.now()}.webp`;
                            const uploadResult = await uploadImage(webpBlob, filename);

                            if (uploadResult.success) {
                                // Replace loading text with actual image markdown
                                // Use server path for preview, but keep relative path in markdown
                                const imagePath = uploadResult.relativePath; // ./draft-assets/...
                                const imageMarkdown = `![Image](${imagePath})`;
                                editor.value = editor.value.replace(loadingText, `\n${imageMarkdown}\n`);
                                updatePreview();

                                console.log(`Image uploaded: ${uploadResult.filename} at ${uploadResult.serverPath}`);
                            } else {
                                alert(`Failed to upload image: ${uploadResult.error}`);
                                editor.value = editor.value.replace(loadingText, '');
                            }
                        } catch (err) {
                            console.error('Image paste error:', err);
                            alert('Failed to process image');
                        }
                    };

                    reader.readAsDataURL(file);
                    break;
                }
            }
        });

        // Convert image to WebP format
        async function convertToWebP(dataUrl) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);

                    canvas.toBlob((blob) => {
                        if (blob) {
                            resolve(blob);
                        } else {
                            reject(new Error('Failed to convert to WebP'));
                        }
                    }, 'image/webp', 0.9);
                };
                img.onerror = () => reject(new Error('Failed to load image'));
                img.src = dataUrl;
            });
        }

        // Upload image to server
        async function uploadImage(blob, filename) {
            const formData = new FormData();
            formData.append('image', blob, filename);

            try {
                const response = await fetch(`${API_BASE}/upload-image`, {
                    method: 'POST',
                    body: formData
                });

                return await response.json();
            } catch (err) {
                return { success: false, error: err.message };
            }
        }

        // Listen to editor changes
        editor.addEventListener('input', debounce(() => {
            updatePreview();
            updateStats();
            if (document.getElementById('auto-save-toggle').checked) {
                autoSaveDraft();
            }
        }, 300));

        // Initial preview
        document.addEventListener('DOMContentLoaded', () => {
            updatePreview();
            updateStats();
            setupResizer();
        });

        // Resizable pane functionality
        function setupResizer() {
            const resizer = document.getElementById('resizer');
            const editorPane = document.getElementById('editor-pane');
            const previewPane = document.getElementById('preview-pane');
            let isResizing = false;

            resizer.addEventListener('mousedown', (e) => {
                isResizing = true;
                document.body.style.cursor = 'col-resize';
                document.body.style.userSelect = 'none';
            });

            document.addEventListener('mousemove', (e) => {
                if (!isResizing) return;

                const containerWidth = document.getElementById('container').offsetWidth;
                const newEditorWidth = (e.clientX / containerWidth) * 100;

                if (newEditorWidth > 20 && newEditorWidth < 80) {
                    editorPane.style.width = `${newEditorWidth}%`;
                    previewPane.style.width = `${100 - newEditorWidth}%`;
                }
            });

            document.addEventListener('mouseup', () => {
                if (isResizing) {
                    isResizing = false;
                    document.body.style.cursor = '';
                    document.body.style.userSelect = '';
                }
            });
        }

        // Open insert modal
        function openInsertModal(type) {
            switch(type) {
                case 'link':
                    modalTitle.textContent = 'Insert Link';
                    modalBody.innerHTML = `
                        <label>URL:</label>
                        <input type="text" id="link-url" placeholder="https://example.com">
                        <label>Text:</label>
                        <input type="text" id="link-text" placeholder="Link text">
                        <div class="preview-box" id="link-preview"></div>
                    `;
                    document.querySelector('.modal-buttons').innerHTML = `
                        <button onclick="closeModal()">Cancel</button>
                        <button class="btn-primary" onclick="insertLink()">Insert</button>
                    `;

                    // Live preview
                    const updateLinkPreview = () => {
                        const url = document.getElementById('link-url').value;
                        const text = document.getElementById('link-text').value || 'Link text';
                        document.getElementById('link-preview').innerHTML = `Preview: <a href="${url}">${text}</a>`;
                    };
                    document.getElementById('link-url').addEventListener('input', updateLinkPreview);
                    document.getElementById('link-text').addEventListener('input', updateLinkPreview);
                    updateLinkPreview();
                    break;

                case 'image':
                    modalTitle.textContent = 'Insert Image';
                    modalBody.innerHTML = `
                        <label>Image URL:</label>
                        <input type="text" id="image-url" placeholder="./assets/image.png">
                        <label>Alt Text:</label>
                        <input type="text" id="image-alt" placeholder="Image description">
                        <label>Caption (optional):</label>
                        <input type="text" id="image-caption" placeholder="Figure caption">
                        <div class="preview-box" id="image-preview"></div>
                    `;
                    document.querySelector('.modal-buttons').innerHTML = `
                        <button onclick="closeModal()">Cancel</button>
                        <button class="btn-primary" onclick="insertImage()">Insert</button>
                    `;

                    const updateImagePreview = () => {
                        const url = document.getElementById('image-url').value;
                        const alt = document.getElementById('image-alt').value || 'Image';
                        const caption = document.getElementById('image-caption').value;
                        let html = `<img src="${url}" alt="${alt}" style="max-width: 100%; height: auto;">`;
                        if (caption) {
                            html = `<figure>${html}<figcaption>${caption}</figcaption></figure>`;
                        }
                        document.getElementById('image-preview').innerHTML = html;
                    };
                    document.getElementById('image-url').addEventListener('input', updateImagePreview);
                    document.getElementById('image-alt').addEventListener('input', updateImagePreview);
                    document.getElementById('image-caption').addEventListener('input', updateImagePreview);
                    updateImagePreview();
                    break;

                case 'video':
                    modalTitle.textContent = 'Insert Video';
                    modalBody.innerHTML = `
                        <label>Video URL:</label>
                        <input type="text" id="video-url" placeholder="./assets/video.mp4">
                        <label>Options:</label>
                        <div style="margin: 10px 0;">
                            <input type="checkbox" id="video-controls" checked> <label style="display: inline; font-weight: normal;">Controls</label><br>
                            <input type="checkbox" id="video-autoplay"> <label style="display: inline; font-weight: normal;">Autoplay</label><br>
                            <input type="checkbox" id="video-loop"> <label style="display: inline; font-weight: normal;">Loop</label>
                        </div>
                    `;
                    document.querySelector('.modal-buttons').innerHTML = `
                        <button onclick="closeModal()">Cancel</button>
                        <button class="btn-primary" onclick="insertVideo()">Insert</button>
                    `;
                    break;

                case 'math-block':
                    modalTitle.textContent = 'Insert Math Block';
                    modalBody.innerHTML = `
                        <label>Equation:</label>
                        <input type="text" id="math-equation" placeholder="E = mc^2">
                        <div class="preview-box" id="math-preview"></div>
                    `;
                    document.querySelector('.modal-buttons').innerHTML = `
                        <button onclick="closeModal()">Cancel</button>
                        <button class="btn-primary" onclick="insertMathBlock()">Insert</button>
                    `;

                    const updateMathPreview = () => {
                        const eq = document.getElementById('math-equation').value;
                        const previewDiv = document.getElementById('math-preview');
                        previewDiv.innerHTML = `$$${eq}$$`;
                        if (typeof renderMathInElement !== 'undefined') {
                            renderMathInElement(previewDiv, {
                                delimiters: [{left: '$$', right: '$$', display: true}],
                                throwOnError: false
                            });
                        }
                    };
                    document.getElementById('math-equation').addEventListener('input', updateMathPreview);
                    updateMathPreview();
                    break;

                case 'math-inline':
                    modalTitle.textContent = 'Insert Inline Math';
                    modalBody.innerHTML = `
                        <label>Equation:</label>
                        <input type="text" id="math-inline-equation" placeholder="x^2 + y^2 = r^2">
                        <div class="preview-box" id="math-inline-preview"></div>
                    `;
                    document.querySelector('.modal-buttons').innerHTML = `
                        <button onclick="closeModal()">Cancel</button>
                        <button class="btn-primary" onclick="insertMathInline()">Insert</button>
                    `;

                    const updateMathInlinePreview = () => {
                        const eq = document.getElementById('math-inline-equation').value;
                        const previewDiv = document.getElementById('math-inline-preview');
                        previewDiv.innerHTML = `Inline: $${eq}$`;
                        if (typeof renderMathInElement !== 'undefined') {
                            renderMathInElement(previewDiv, {
                                delimiters: [{left: '$', right: '$', display: false}],
                                throwOnError: false
                            });
                        }
                    };
                    document.getElementById('math-inline-equation').addEventListener('input', updateMathInlinePreview);
                    updateMathInlinePreview();
                    break;

                case 'code':
                    modalTitle.textContent = 'Insert Code Block';
                    modalBody.innerHTML = `
                        <label>Language:</label>
                        <select id="code-language">
                            <option value="javascript">JavaScript</option>
                            <option value="python">Python</option>
                            <option value="html">HTML</option>
                            <option value="css">CSS</option>
                            <option value="cpp">C++</option>
                            <option value="java">Java</option>
                            <option value="bash">Bash</option>
                            <option value="text">Plain Text</option>
                        </select>
                    `;
                    document.querySelector('.modal-buttons').innerHTML = `
                        <button onclick="closeModal()">Cancel</button>
                        <button class="btn-primary" onclick="insertCode()">Insert</button>
                    `;
                    break;

                case 'table':
                    modalTitle.textContent = 'Insert Table';
                    modalBody.innerHTML = `
                        <label>Rows:</label>
                        <input type="number" id="table-rows" value="3" min="1">
                        <label>Columns:</label>
                        <input type="number" id="table-cols" value="3" min="1">
                        <div style="margin: 10px 0;">
                            <input type="checkbox" id="table-header" checked>
                            <label style="display: inline; font-weight: normal;">Include header row</label>
                        </div>
                    `;
                    document.querySelector('.modal-buttons').innerHTML = `
                        <button onclick="closeModal()">Cancel</button>
                        <button class="btn-primary" onclick="insertTable()">Insert</button>
                    `;
                    break;
            }

            modalOverlay.style.display = 'block';
        }

        // Insert functions
        function insertLink() {
            const url = document.getElementById('link-url').value;
            const text = document.getElementById('link-text').value || url;
            insertMarkdown(`[${text}](${url})`, '');
            closeModal();
        }

        function insertImage() {
            const url = document.getElementById('image-url').value;
            const alt = document.getElementById('image-alt').value || 'Image';
            const caption = document.getElementById('image-caption').value;

            let markdown = `![${alt}](${url})`;
            if (caption) {
                markdown = `<figure>\n  <img src="${url}" alt="${alt}" width="100%">\n  <figcaption><strong>Figure:</strong> ${caption}</figcaption>\n</figure>`;
            }

            insertMarkdown(markdown, '');
            closeModal();
        }

        function insertVideo() {
            const url = document.getElementById('video-url').value;
            const controls = document.getElementById('video-controls').checked;
            const autoplay = document.getElementById('video-autoplay').checked;
            const loop = document.getElementById('video-loop').checked;

            let attrs = controls ? 'controls ' : '';
            attrs += autoplay ? 'autoplay ' : '';
            attrs += loop ? 'loop ' : '';

            const markdown = `<video ${attrs}style="width: 100%">\n  <source src="${url}" type="video/mp4">\n</video>`;
            insertMarkdown(markdown, '');
            closeModal();
        }

        function insertMathBlock() {
            const eq = document.getElementById('math-equation').value;
            insertMarkdown(`$$\n${eq}\n$$\n`, '');
            closeModal();
        }

        function insertMathInline() {
            const eq = document.getElementById('math-inline-equation').value;
            insertMarkdown(`$${eq}$`, '');
            closeModal();
        }

        function insertCode() {
            const lang = document.getElementById('code-language').value;
            insertMarkdown(`\`\`\`${lang}\n`, '\n\`\`\`\n');
            closeModal();
        }

        function insertTable() {
            const rows = parseInt(document.getElementById('table-rows').value);
            const cols = parseInt(document.getElementById('table-cols').value);
            const hasHeader = document.getElementById('table-header').checked;

            let table = '| ';
            for (let i = 0; i < cols; i++) {
                table += hasHeader ? `Header ${i+1} | ` : `Column ${i+1} | `;
            }
            table += '\n| ';
            for (let i = 0; i < cols; i++) {
                table += '--- | ';
            }
            table += '\n';

            for (let r = 0; r < rows; r++) {
                table += '| ';
                for (let c = 0; c < cols; c++) {
                    table += `Cell ${r+1},${c+1} | `;
                }
                table += '\n';
            }

            insertMarkdown(table, '');
            closeModal();
        }

        // New draft
        function newDraft() {
            if (confirm('Create a new draft? Current content will be cleared.')) {
                editor.value = '## New Post\n\nStart writing...';
                updatePreview();
            }
        }

        // Save draft
        async function saveDraft() {
            const filename = prompt('Enter draft filename:', `draft-${Date.now()}.md`);
            if (!filename) return;

            try {
                const response = await fetch(`${API_BASE}/draft`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        filename: filename,
                        content: editor.value
                    })
                });

                const result = await response.json();
                if (result.success) {
                    alert(`Draft saved: ${result.filename}`);
                } else {
                    alert(`Error: ${result.error}`);
                }
            } catch (err) {
                alert(`Failed to save draft: ${err.message}`);
            }
        }

        // Open load modal
        async function openLoadModal() {
            try {
                const response = await fetch(`${API_BASE}/drafts`);
                const result = await response.json();

                if (!result.drafts || result.drafts.length === 0) {
                    alert('No drafts found');
                    return;
                }

                modalTitle.textContent = 'Load Draft';
                modalBody.innerHTML = '<div class="draft-list"></div>';
                const draftList = modalBody.querySelector('.draft-list');

                result.drafts.forEach(draft => {
                    const item = document.createElement('div');
                    item.className = 'draft-item';
                    item.innerHTML = `
                        <span>${draft}</span>
                        <div>
                            <button class="btn-primary" onclick="loadDraft('${draft}')">Load</button>
                            <button class="btn-danger" onclick="deleteDraft('${draft}')">Delete</button>
                        </div>
                    `;
                    draftList.appendChild(item);
                });

                document.querySelector('.modal-buttons').innerHTML = `
                    <button onclick="closeModal()">Close</button>
                `;

                modalOverlay.style.display = 'block';
            } catch (err) {
                alert(`Failed to load drafts: ${err.message}`);
            }
        }

        // Load draft
        async function loadDraft(filename) {
            try {
                const response = await fetch(`${API_BASE}/draft/${encodeURIComponent(filename)}`);
                const result = await response.json();

                if (result.content) {
                    editor.value = result.content;
                    updatePreview();
                    closeModal();
                } else {
                    alert(`Error: ${result.error}`);
                }
            } catch (err) {
                alert(`Failed to load draft: ${err.message}`);
            }
        }

        // Delete draft
        async function deleteDraft(filename) {
            if (!confirm(`Delete draft "${filename}"?`)) return;

            try {
                const response = await fetch(`${API_BASE}/draft/${encodeURIComponent(filename)}`, {
                    method: 'DELETE'
                });

                const result = await response.json();
                if (result.success) {
                    openLoadModal(); // Refresh list
                } else {
                    alert(`Error: ${result.error}`);
                }
            } catch (err) {
                alert(`Failed to delete draft: ${err.message}`);
            }
        }

        // Save to post
        async function saveToPost() {
            const postId = document.getElementById('post-id-input').value.trim();
            const language = document.getElementById('language-select').value;

            if (!postId) {
                alert('Please enter a Post ID');
                return;
            }

            // Count assets that will be migrated
            const assetMatches = editor.value.match(/\.\/draft-assets\/[^\s\)]+/g);
            const assetCount = assetMatches ? assetMatches.length : 0;

            let confirmMsg = `Save to posts/${postId}/content-${language}.md?`;
            if (assetCount > 0) {
                confirmMsg += `\n\n${assetCount} image(s) will be migrated to posts/${postId}/assets/`;
            }

            if (!confirm(confirmMsg)) return;

            try {
                const response = await fetch(`${API_BASE}/post`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        postId: postId,
                        language: language,
                        content: editor.value
                    })
                });

                const result = await response.json();
                if (result.success) {
                    let successMsg = `✅ Saved to ${result.path}`;
                    if (result.assetsMigrated > 0) {
                        successMsg += `\n\n📦 ${result.assetsMigrated} asset(s) migrated to posts/${postId}/assets/`;
                    }
                    alert(successMsg);
                } else {
                    alert(`Error: ${result.error}`);
                }
            } catch (err) {
                alert(`Failed to save post: ${err.message}`);
            }
        }

        // Download markdown
        function downloadMarkdown() {
            const content = editor.value;
            const filename = prompt('Enter filename:', 'post.md');
            if (!filename) return;

            const blob = new Blob([content], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename.endsWith('.md') ? filename : `${filename}.md`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // Upload markdown
        function uploadMarkdown() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.md,.markdown,.txt';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        editor.value = e.target.result;
                        updatePreview();
                    };
                    reader.readAsText(file);
                }
            };
            input.click();
        }

        // Close modal
        function closeModal() {
            modalOverlay.style.display = 'none';
        }

        // Auto-save functionality
        let autoSaveTimer;
        function autoSaveDraft() {
            clearTimeout(autoSaveTimer);
            autoSaveTimer = setTimeout(async () => {
                if (!document.body.classList.contains('edit-mode')) return;

                const filename = `autosave-${Date.now()}.md`;
                try {
                    await fetch(`${API_BASE}/draft`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            filename: filename,
                            content: editor.value
                        })
                    });
                    console.log('Auto-saved:', filename);
                } catch (err) {
                    console.error('Auto-save failed:', err);
                }
            }, 5000); // Auto-save after 5 seconds of inactivity
        }

        // Google Drive OAuth state
        let googleDriveAuth = {
            isSignedIn: false,
            userEmail: null
        };

        // Google Drive Client ID - replace with your own
        const GOOGLE_CLIENT_ID = ''; // Leave empty - user will be prompted to authenticate

        // Initialize Google Drive API
        function initGoogleDrive() {
            gapi.load('client:auth2', () => {
                gapi.client.init({
                    apiKey: '', // Not needed for OAuth flow
                    clientId: GOOGLE_CLIENT_ID || prompt('Enter your Google Drive Client ID:'),
                    discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest'],
                    scope: 'https://www.googleapis.com/auth/drive.file'
                }).then(() => {
                    const authInstance = gapi.auth2.getAuthInstance();

                    // Listen for sign-in state changes
                    authInstance.isSignedIn.listen(updateSignInStatus);

                    // Handle initial sign-in state
                    updateSignInStatus(authInstance.isSignedIn.get());
                }).catch(err => {
                    console.error('Google Drive API init failed:', err);
                });
            });
        }

        // Update sign-in status
        function updateSignInStatus(isSignedIn) {
            googleDriveAuth.isSignedIn = isSignedIn;

            if (isSignedIn) {
                const user = gapi.auth2.getAuthInstance().currentUser.get();
                const profile = user.getBasicProfile();
                googleDriveAuth.userEmail = profile.getEmail();
                console.log('Google Drive connected:', googleDriveAuth.userEmail);
            } else {
                googleDriveAuth.userEmail = null;
            }

            updateDriveBackupButton();
        }

        // Update backup button text based on auth status
        function updateDriveBackupButton() {
            const backupBtn = document.getElementById('drive-backup-btn');
            const signoutBtn = document.getElementById('drive-signout-btn');

            if (backupBtn && signoutBtn) {
                if (googleDriveAuth.isSignedIn) {
                    const email = googleDriveAuth.userEmail;
                    const shortEmail = email.length > 20 ? email.substring(0, 17) + '...' : email;
                    backupBtn.innerHTML = `☁️ Backup (${shortEmail})`;
                    backupBtn.title = `Connected to Google Drive: ${email}`;
                    backupBtn.style.background = '#34a853';
                    backupBtn.style.color = 'white';
                    signoutBtn.style.display = 'inline-block';
                } else {
                    backupBtn.innerHTML = '☁️ Backup to Drive';
                    backupBtn.title = 'Click to sign in to Google Drive';
                    backupBtn.style.background = '';
                    backupBtn.style.color = '';
                    signoutBtn.style.display = 'none';
                }
            }
        }

        // Google Drive backup with OAuth
        function backupToGoogleDrive() {
            // Initialize if not already done
            if (typeof gapi === 'undefined' || !gapi.auth2) {
                initGoogleDrive();
                setTimeout(() => backupToGoogleDrive(), 1000);
                return;
            }

            const authInstance = gapi.auth2.getAuthInstance();

            // Check if signed in
            if (!authInstance.isSignedIn.get()) {
                // Sign in first
                authInstance.signIn().then(() => {
                    // After sign-in, proceed with backup
                    uploadToGoogleDrive();
                }).catch(err => {
                    console.error('Google Sign-In failed:', err);
                    alert('Sign-in cancelled or failed. Using local download instead.');
                    downloadMarkdown();
                });
            } else {
                // Already signed in, proceed with backup
                uploadToGoogleDrive();
            }
        }

        // Upload file to Google Drive
        function uploadToGoogleDrive() {
            const content = editor.value;
            const filename = `blog-backup-${Date.now()}.md`;
            const metadata = {
                name: filename,
                mimeType: 'text/markdown'
            };

            const form = new FormData();
            form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
            form.append('file', new Blob([content], { type: 'text/markdown' }));

            const accessToken = gapi.auth.getToken().access_token;

            fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
                method: 'POST',
                headers: new Headers({ 'Authorization': 'Bearer ' + accessToken }),
                body: form
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    throw new Error(data.error.message);
                }
                alert(`✅ Backed up to Google Drive: ${data.name}\n\nFile ID: ${data.id}`);
            })
            .catch(err => {
                console.error('Google Drive backup failed:', err);
                alert('Failed to backup to Google Drive.\n\nError: ' + err.message + '\n\nFalling back to local download.');
                downloadMarkdown();
            });
        }

        // Sign out from Google Drive
        function signOutGoogleDrive() {
            if (gapi.auth2) {
                gapi.auth2.getAuthInstance().signOut().then(() => {
                    console.log('Signed out from Google Drive');
                });
            }
        }

        // Fullscreen toggle
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            // Ctrl/Cmd + S to save
            if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                e.preventDefault();
                if (document.body.classList.contains('edit-mode')) {
                    saveDraft();
                } else {
                    downloadMarkdown();
                }
            }

            // Ctrl/Cmd + B for bold
            if ((e.ctrlKey || e.metaKey) && e.key === 'b') {
                e.preventDefault();
                insertMarkdown('**', '**');
            }

            // Ctrl/Cmd + I for italic
            if ((e.ctrlKey || e.metaKey) && e.key === 'i') {
                e.preventDefault();
                insertMarkdown('*', '*');
            }

            // F11 for fullscreen
            if (e.key === 'F11') {
                e.preventDefault();
                toggleFullscreen();
            }
        });
    </script>
    <!-- Google Drive API (loaded on demand) -->
    <script src="https://apis.google.com/js/api.js"></script>
