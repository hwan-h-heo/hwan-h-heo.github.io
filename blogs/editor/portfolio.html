<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Portfolio Editor</title>
    <link rel="icon" type="image/x-icon" href="../../assets/favicon.ico" />
    <link rel="stylesheet" href="/assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="./editor.css" rel="stylesheet" />
    <link href="./portfolio.css" rel="stylesheet" />
</head>
<body>
    <div class="editor-shell portfolio-editor-shell">
        <header class="topbar">
            <div>
                <p class="eyebrow">Portfolio Editor</p>
                <h1>Edit projects, publications, and talks</h1>
            </div>
            <div class="topbar-actions">
                <span id="save-status" class="mode-badge">Loading</span>
                <a class="button button-secondary" href="./">Blog editor</a>
                <button id="add-button" class="button button-secondary">Add item</button>
                <button id="save-button" class="button button-primary">Save portfolio</button>
            </div>
        </header>

        <main class="portfolio-workspace">
            <aside class="portfolio-sidebar">
                <section class="panel">
                    <div class="panel-header">
                        <h2>Section</h2>
                    </div>
                    <div class="section-tabs" role="tablist">
                        <button class="section-tab is-active" data-section="portfolioProjects">Projects</button>
                        <button class="section-tab" data-section="publications">Publications</button>
                        <button class="section-tab" data-section="talks">Talks</button>
                        <button class="section-tab" data-section="projectPages">Project Pages</button>
                    </div>
                </section>

                <section class="panel">
                    <div class="panel-header">
                        <h2 id="list-title">Projects</h2>
                        <span id="item-count" class="pill">0 items</span>
                    </div>
                    <div id="item-list" class="portfolio-item-list"></div>
                </section>
            </aside>

            <section class="portfolio-editor-stage">
                <section class="panel portfolio-form-panel">
                    <div class="panel-header panel-header-inline">
                        <h2 id="form-title">Item</h2>
                        <div class="portfolio-form-actions">
                            <button id="move-up-button" class="button button-secondary">Move up</button>
                            <button id="move-down-button" class="button button-secondary">Move down</button>
                            <button id="duplicate-button" class="button button-secondary">Duplicate</button>
                            <button id="delete-button" class="button button-secondary button-danger">Delete</button>
                        </div>
                    </div>
                    <div id="feedback" class="feedback feedback-neutral">
                        <strong>Ready.</strong>
                        <p>Select an item or add a new one.</p>
                    </div>
                    <form id="portfolio-form" class="portfolio-form"></form>
                </section>
                <aside class="panel portfolio-preview-panel">
                    <div class="panel-header">
                        <h2>Preview</h2>
                        <span id="preview-kind" class="pill">Project</span>
                    </div>
                    <div id="portfolio-preview" class="portfolio-preview"></div>
                    <p class="panel-copy">
                        This preview uses the same data fields as the portfolio home. Save, then rebuild to publish changes.
                    </p>
                </aside>
            </section>
        </main>
    </div>

    <div id="project-create-modal" class="portfolio-modal-overlay is-hidden">
        <div class="portfolio-modal">
            <div class="modal-header">
                <h2>Create Project Page</h2>
                <button id="project-create-close-button" class="icon-button icon-button-small" type="button" aria-label="Close modal">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>
            <form id="project-create-form" class="portfolio-create-form">
                <label class="field">
                    <span>Slug</span>
                    <input id="project-create-slug" type="text" placeholder="new_project" />
                </label>
                <label class="field">
                    <span>Title</span>
                    <input id="project-create-title" type="text" placeholder="New Project" />
                </label>
                <label class="field">
                    <span>Subtitle</span>
                    <input id="project-create-subtitle" type="text" placeholder="Project" />
                </label>
                <label class="checkbox-row checkbox-row-stacked">
                    <input id="project-create-card" type="checkbox" />
                    <span>Create a portfolio card for this page</span>
                </label>
                <label class="field">
                    <span>Card image</span>
                    <input id="project-create-card-image" type="text" placeholder="assets/thumbnails/example.png" />
                </label>
                <div class="portfolio-modal-actions">
                    <button id="project-create-cancel-button" class="button button-secondary" type="button">Cancel</button>
                    <button class="button button-primary" type="submit">Create</button>
                </div>
            </form>
        </div>
    </div>

    <input id="project-asset-upload" class="visually-hidden" type="file" accept="image/*,video/*" />

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="./portfolio.js"></script>
</body>
</html>
