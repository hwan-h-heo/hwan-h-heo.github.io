<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="Hwan Heo's personal blog about 3d computer vision and machine learning" />
        <meta name="author" content="Hwan Heo" />
        <title>HwanHeo's Blog</title>
        <link rel="icon" type="image/x-icon" href="../assets/favicon.ico" />
        <!-- Google fonts-->
        <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Manrope:wght@500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
        <!-- Core theme CSS (includes Bootstrap)-->
        <link href="css/blog.css" rel="stylesheet" />
        <link href="/assets/vendor/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet" />
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-RF7ETSKPK9"></script>
        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', 'G-RF7ETSKPK9');

        <script>
            (function() {
                try {
                    const storedTheme = localStorage.getItem('blog-theme');
                    const theme = storedTheme === 'dark' || storedTheme === 'light' ? storedTheme : 'light';
                    document.documentElement.dataset.theme = theme;
                } catch (error) {}
            })();
        </script>
    <script src="../js/sidebar-controller.js"></script>
    <link href="css/sidebar.css" rel="stylesheet">
    <link href="../css/sidebar-nav.css" rel="stylesheet">
    <link href="css/typography.css" rel="stylesheet">
    </head>
    <body class="blog-home-page">
        <header id="header" class="header blog-sidebar dark-background d-flex flex-column">
            <div class="profile-img">
              <img src="../assets/icon.webp" alt="Portrait illustration of Hwan Heo" class="img-fluid rounded-circle">
            </div>
        
            <a href="./" class="logo d-flex align-items-center justify-content-center">
              <span class="sitename">Hwan's Blog</span>
            </a>

            <div class="social-links text-center">
              <a href="https://github.com/hwanhuh" class="github" aria-label="GitHub"><i class="bi bi-github" aria-hidden="true"></i></a>
              <a href="https://www.linkedin.com/in/hwan-heo-0905korea/" class="linkedin" aria-label="LinkedIn"><i class="bi bi-linkedin" aria-hidden="true"></i></a>
              <a href="https://scholar.google.com/citations?user=RulvYTkAAAAJ" class="instagram" aria-label="Google Scholar"><i class="bi bi-mortarboard-fill" aria-hidden="true"></i></a>
              <a href="mailto:hwan.heo.ai@gmail.com" class="google-plus" aria-label="Email"><i class="bi bi-envelope-fill" aria-hidden="true"></i></a>
            </div>
        
            <nav id="navmenu" class="navmenu">
                <ul>
                    <li><a href="./" class="active"><i class="bi bi-house-door navicon" aria-hidden="true"></i>Blog Home</a></li>
                    <li>
                        <a href="../" class="sidebar-external-link">
                            <i class="bi bi-briefcase navicon" aria-hidden="true"></i>
                            <span>Portfolio</span>
                            <i class="bi bi-box-arrow-up-right sidebar-external-icon" aria-hidden="true"></i>
                        </a>
                    </li>
                </ul>
            </nav>

            <div class="sidebar-labs">
                <details class="sidebar-labs-menu">
                    <summary>
                        <i class="bi bi-tools navicon" aria-hidden="true"></i>
                        <span>Labs</span>
                        <i class="bi bi-chevron-down sidebar-labs-chevron" aria-hidden="true"></i>
                    </summary>
                    <div class="sidebar-labs-panel">
                        <a href="./3DViewer/"><i class="bi bi-box navicon" aria-hidden="true"></i><span>3D Viewer</span></a>
                        <a href="./editor/"><i class="bi bi-pencil-square navicon" aria-hidden="true"></i><span>Editor</span></a>
                    </div>
                </details>
            </div>

        </header>
        <main class="main blog-home-main">
        <nav class="blog-home-topbar" id="blogHomeTopbar" aria-label="Blog utilities">
            <div class="blog-home-toolbar-actions">
                <form id="blog-home-search-form" class="blog-home-search" role="search">
                    <label class="visually-hidden" for="blog-home-search-input">Search posts</label>
                    <input type="text" id="blog-home-search-input" data-placeholder-i18n="searchPlaceholder" placeholder="Search...">
                    <button type="submit" aria-label="Search">
                        <i class="bi bi-search" aria-hidden="true"></i>
                    </button>
                </form>
                <button class="blog-theme-toggle" type="button" data-theme-toggle aria-label="Toggle color theme" aria-pressed="false">
                    <i class="bi bi-moon-stars" aria-hidden="true"></i>
                </button>
                <button id="lang-toggle-main" class="blog-home-language" type="button" aria-label="Switch language"></button>
            </div>
        </nav>

        <header class="masthead blog-home-hero" style="background-image: url('../assets/image_fx_.jpg'); background-position: center 34%; background-size: cover;">
            <div class="container position-relative px-4 px-lg-5">
                <div class="blog-home-hero-grid">
                    <div class="blog-home-hero-copy">
                        <span class="blog-home-kicker" data-i18n="heroKicker">Hwan's Blog</span>
                        <h1 data-i18n="heroTitle">Research notes for 3D AI systems</h1>
                        <p data-i18n="heroIntro">3D generation, computer vision, graphics, CUDA inference, and the implementation details that usually stay between commits.</p>
                    </div>
                </div>
            </div>
        </header>

        <div class="container px-4 px-lg-5 blog-home-container">
            <section id="blog-home-feature" class="blog-home-feature" aria-live="polite"></section>

            <section class="blog-home-archive" aria-labelledby="blog-home-archive-title">
                <div class="blog-home-archive-head">
                    <div>
                        <h2 id="blog-home-archive-title" data-i18n="archiveTitle">Archive</h2>
                    </div>
                    <ul class="nav blog-home-tabs" role="tablist" aria-label="Blog categories">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" id="posts-tab-control" data-bs-toggle="tab" data-bs-target="#posts-tab" type="button" role="tab" aria-controls="posts-tab" aria-selected="true">
                                <span data-i18n="tabPosts">Posts</span>
                                <span class="blog-home-tab-count" id="posts-count"></span>
                            </button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="notes-tab-control" data-bs-toggle="tab" data-bs-target="#notes-tab" type="button" role="tab" aria-controls="notes-tab" aria-selected="false">
                                <span data-i18n="tabNotes">Notes</span>
                                <span class="blog-home-tab-count" id="notes-count"></span>
                            </button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="series-tab-control" data-bs-toggle="tab" data-bs-target="#series-tab" type="button" role="tab" aria-controls="series-tab" aria-selected="false">
                                <span data-i18n="tabSeries">Series</span>
                                <span class="blog-home-tab-count" id="series-count"></span>
                            </button>
                        </li>
                    </ul>
                </div>

                <div class="tab-content blog-home-tab-content">
                    <div class="tab-pane fade show active" id="posts-tab" role="tabpanel" aria-labelledby="posts-tab-control" tabindex="0">
                    </div>

                    <div class="tab-pane fade" id="notes-tab" role="tabpanel" aria-labelledby="notes-tab-control" tabindex="0">
                    </div>

                    <div class="tab-pane fade" id="series-tab" role="tabpanel" aria-labelledby="series-tab-control" tabindex="0">
                    </div>
                </div>
            </section>

                    <!-- Divider-->
                    <!-- Pager-->
                    <div class="mb-5 d-flex justify-content-end">
                        <button id="scroll-top" class="scroll-top button_top d-flex align-items-center justify-content-center">
                            <svg class="svgIcon" viewBox="0 0 384 512">
                              <path
                                d="M214.6 41.4c-12.5-12.5-32.8-12.5-45.3 0l-160 160c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L160 141.2V448c0 17.7 14.3 32 32 32s32-14.3 32-32V141.2L329.4 246.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3l-160-160z"
                              ></path>
                            </svg>
                        </button>
                    </div>
        </div>
        <!-- Footer-->
        <footer class="blog-home-footer">
            <div class="container px-4 px-lg-5">
                <div class="row gx-4 gx-lg-5 justify-content-center">
                    <div class="col-md-10 col-lg-9 col-xl-9">
                        <div class="small text-center text-muted fst-italic">Copyright &copy; Hwan Heo</div>
                    </div>
                </div>
            </div>
        </footer>
        <!-- Bootstrap core JS-->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="./js/site-data-client.js"></script>
        <script src="./js/blog-cover-media.js"></script>
        <script src="./js/blog-shell.js"></script>
        <script src="./js/theme-toggle.js"></script>
        <script src="./js/main-list.js"></script>
        <script>
            initBlogShell({ formSelector: '#blog-home-search-form', inputSelector: '#blog-home-search-input' });
        </script>
    </main>

</html>
