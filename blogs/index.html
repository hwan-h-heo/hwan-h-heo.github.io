<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="Hwan Heo's personal blog about 3d computer vision and machine learning" />
        <meta name="author" content="Hwan Heo" />
        <title>HwanHeo's Blog</title>
        <link rel="icon" type="image/x-icon" href="../assets/favicon.ico" />
        <!-- Google fonts-->
        <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Manrope:wght@500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
        <!-- Blog styles -->
        <link href="css/blog.css" rel="stylesheet" />
        <link href="/assets/css/site-icons.css" rel="stylesheet" />
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-RF7ETSKPK9"></script>
        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', 'G-RF7ETSKPK9');
        </script>
        <script>
            (function() {
                try {
                    const storedTheme = localStorage.getItem('blog-theme');
                    const theme = storedTheme === 'dark' || storedTheme === 'light' ? storedTheme : 'light';
                    document.documentElement.dataset.theme = theme;
                } catch (error) {}
            })();
        </script>
    <script src="/assets/js/site-icons.js"></script>
    <script src="../js/sidebar-controller.js"></script>
    <link href="css/sidebar.css" rel="stylesheet">
    <link href="../css/sidebar-nav.css" rel="stylesheet">
    <link href="css/typography.css" rel="stylesheet">
    </head>
    <body class="blog-home-page">
        <header id="header" class="header blog-sidebar dark-background">
            <div class="profile-img">
              <img src="../assets/icon.webp" alt="Portrait illustration of Hwan Heo">
            </div>
        
            <a href="./" class="logo">
              <span class="sitename">Hwan's Blog</span>
            </a>

            <div class="social-links">
              <a href="https://github.com/hwanhuh" class="github" aria-label="GitHub"><svg class="site-icon" aria-hidden="true" focusable="false"><use href="/assets/icons/site-icons.svg#icon-github"></use></svg></a>
              <a href="https://www.linkedin.com/in/hwan-heo-0905korea/" class="linkedin" aria-label="LinkedIn"><svg class="site-icon" aria-hidden="true" focusable="false"><use href="/assets/icons/site-icons.svg#icon-linkedin"></use></svg></a>
              <a href="https://scholar.google.com/citations?user=RulvYTkAAAAJ" class="instagram" aria-label="Google Scholar"><svg class="site-icon" aria-hidden="true" focusable="false"><use href="/assets/icons/site-icons.svg#icon-mortarboard-fill"></use></svg></a>
              <a href="mailto:hwan.heo.ai@gmail.com" class="google-plus" aria-label="Email"><svg class="site-icon" aria-hidden="true" focusable="false"><use href="/assets/icons/site-icons.svg#icon-envelope-fill"></use></svg></a>
            </div>
        
            <nav id="navmenu" class="navmenu">
                <ul>
                    <li><a href="./" class="active"><svg class="site-icon navicon" aria-hidden="true" focusable="false"><use href="/assets/icons/site-icons.svg#icon-house"></use></svg>Blog Home</a></li>
                    <li>
                        <a href="../" class="sidebar-external-link">
                            <svg class="site-icon navicon" aria-hidden="true" focusable="false"><use href="/assets/icons/site-icons.svg#icon-briefcase"></use></svg>
                            <span>Portfolio</span>
                            <svg class="site-icon sidebar-external-icon" aria-hidden="true" focusable="false"><use href="/assets/icons/site-icons.svg#icon-box-arrow-up-right"></use></svg>
                        </a>
                    </li>
                </ul>
            </nav>

            <div class="sidebar-labs">
                <details class="sidebar-labs-menu">
                    <summary>
                        <svg class="site-icon navicon" aria-hidden="true" focusable="false"><use href="/assets/icons/site-icons.svg#icon-tools"></use></svg>
                        <span>Labs</span>
                        <svg class="site-icon sidebar-labs-chevron" aria-hidden="true" focusable="false"><use href="/assets/icons/site-icons.svg#icon-chevron-down"></use></svg>
                    </summary>
                    <div class="sidebar-labs-panel">
                        <a href="./3DViewer/"><svg class="site-icon navicon" aria-hidden="true" focusable="false"><use href="/assets/icons/site-icons.svg#icon-box"></use></svg><span>3D Viewer</span></a>
                        <a href="./editor/"><svg class="site-icon navicon" aria-hidden="true" focusable="false"><use href="/assets/icons/site-icons.svg#icon-pencil-square"></use></svg><span>Markdown Editor</span></a>
                    </div>
                </details>
            </div>

        </header>
        <main class="main blog-home-main">
        <nav class="blog-home-topbar" id="blogHomeTopbar" aria-label="Blog utilities">
            <div class="blog-home-toolbar-actions">
                <form id="blog-home-search-form" class="blog-home-search" role="search" data-collapsible-search>
                    <label class="visually-hidden" for="blog-home-search-input">Search posts</label>
                    <input type="text" id="blog-home-search-input" data-placeholder-i18n="searchPlaceholder" placeholder="Search...">
                    <button type="submit" aria-label="Search">
                        <svg class="site-icon" aria-hidden="true" focusable="false"><use href="/assets/icons/site-icons.svg#icon-search"></use></svg>
                    </button>
                </form>
                <button class="blog-theme-toggle" type="button" data-theme-toggle aria-label="Toggle color theme" aria-pressed="false">
                    <svg class="site-icon" data-icon="moon-stars" aria-hidden="true" focusable="false"><use href="/assets/icons/site-icons.svg#icon-moon-stars"></use></svg>
                </button>
                <button id="lang-toggle-main" class="blog-home-language" type="button" aria-label="한국어로 전환" title="한국어로 전환">가</button>
            </div>
        </nav>

        <header class="masthead blog-home-hero blog-editorial-hero">
            <div class="blog-editorial-visual" aria-hidden="true"></div>
            <div class="blog-editorial-visual-left" aria-hidden="true"></div>
            <div class="blog-shell blog-hero-shell">
                <div class="blog-home-hero-copy">
                    <div class="blog-editorial-imprint" aria-label="Hwan's Blog index, 2021 to 2026">
                        <div class="blog-editorial-brandline" lang="en">
                            <span class="blog-editorial-index">00</span>
                            <span class="blog-editorial-separator" aria-hidden="true">/</span>
                            <span class="blog-home-kicker">Hwan's Blog</span>
                        </div>
                        <span class="blog-editorial-edition" lang="en">2021—2026</span>
                    </div>
                    <h1 lang="en">Research notes for 3D AI systems</h1>
                    <div class="blog-editorial-deck">
                        <p class="blog-home-hero-deck" lang="en">3D generation, computer vision, graphics, CUDA inference, and implementation details between commits.</p>
                        <dl class="blog-publication-index" aria-label="Publication index">
                            <div>
                                <dt>Posts</dt>
                                <dd id="hero-posts-count"></dd>
                            </div>
                            <div>
                                <dt>Notes</dt>
                                <dd id="hero-notes-count"></dd>
                            </div>
                            <div>
                                <dt>Series</dt>
                                <dd id="hero-series-count"></dd>
                            </div>
                        </dl>
                    </div>
                </div>
            </div>
        </header>

        <div class="blog-shell blog-home-container">
            <section id="blog-home-feature" class="blog-home-feature" aria-live="polite"></section>

            <section class="blog-home-archive" aria-labelledby="blog-home-archive-title">
                <div class="blog-home-archive-head">
                    <h2 id="blog-home-archive-title">
                        <span class="blog-home-archive-index" aria-hidden="true">02</span>
                        <span data-i18n="archiveTitle">Articles</span>
                    </h2>
                    <span class="blog-home-archive-rule" aria-hidden="true"></span>
                    <ul class="blog-home-tabs" role="tablist" aria-label="Blog categories">
                        <li class="blog-home-tab-item" role="presentation">
                            <button class="blog-home-tab is-active" id="posts-tab-control" data-tab-target="#posts-tab" type="button" role="tab" aria-controls="posts-tab" aria-selected="true" tabindex="0">
                                <span data-i18n="tabPosts">Posts</span>
                                <span class="blog-home-tab-count" id="posts-count"></span>
                            </button>
                        </li>
                        <li class="blog-home-tab-item" role="presentation">
                            <button class="blog-home-tab" id="notes-tab-control" data-tab-target="#notes-tab" type="button" role="tab" aria-controls="notes-tab" aria-selected="false" tabindex="-1">
                                <span data-i18n="tabNotes">Notes</span>
                                <span class="blog-home-tab-count" id="notes-count"></span>
                            </button>
                        </li>
                        <li class="blog-home-tab-item" role="presentation">
                            <button class="blog-home-tab" id="series-tab-control" data-tab-target="#series-tab" type="button" role="tab" aria-controls="series-tab" aria-selected="false" tabindex="-1">
                                <span data-i18n="tabSeries">Series</span>
                                <span class="blog-home-tab-count" id="series-count"></span>
                            </button>
                        </li>
                    </ul>
                </div>

                <div class="blog-home-tab-content">
                    <div class="blog-home-tab-panel is-active" id="posts-tab" role="tabpanel" aria-labelledby="posts-tab-control" tabindex="0">
                    </div>

                    <div class="blog-home-tab-panel" id="notes-tab" role="tabpanel" aria-labelledby="notes-tab-control" tabindex="0" hidden>
                    </div>

                    <div class="blog-home-tab-panel" id="series-tab" role="tabpanel" aria-labelledby="series-tab-control" tabindex="0" hidden>
                    </div>
                </div>
            </section>

                    <!-- Divider-->
                    <!-- Pager-->
                    <div class="blog-home-scroll-action">
                        <button id="scroll-top" class="scroll-top button_top" type="button" aria-label="Back to top">
                            <svg class="site-icon" aria-hidden="true" focusable="false"><use href="/assets/icons/site-icons.svg#icon-arrow-up"></use></svg>
                        </button>
                    </div>
        </div>
        <!-- Footer-->
        <footer class="blog-home-footer">
            <div class="blog-shell">
                <div class="blog-home-footer-row">
                    <div class="blog-home-footer-copy">
                        <div class="blog-footer-note">Copyright &copy; Hwan Heo</div>
                    </div>
                </div>
            </div>
        </footer>
        <script src="./js/site-data-client.js"></script>
        <script src="./js/blog-cover-media.js"></script>
        <script src="./js/blog-shell.js"></script>
        <script src="./js/theme-toggle.js"></script>
        <script src="./js/main-list.js"></script>
        <script>
            initBlogShell({ formSelector: '#blog-home-search-form', inputSelector: '#blog-home-search-input' });
        </script>
    </main>
    </body>
</html>
